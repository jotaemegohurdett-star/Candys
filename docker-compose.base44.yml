# Base44 sandbox environment — development oriented.
#   * every app service runs FROM THE BIND-MOUNTED SOURCE with a dev command
#   * Postgres runs locally; DATABASE_URL points at it
#   * the web entry point (Vite dev server) is published on host port 3000
# Usage: docker compose -f docker-compose.base44.yml up -d --build
name: candys-pet

x-app-image: &app-image
  build:
    context: .
    dockerfile: .base44/Dockerfile

x-app-env: &app-env
  DATABASE_URL: postgres://candy:candy@db:5432/candyspet

services:
  db:
    image: postgres:16
    restart: on-failure
    environment:
      POSTGRES_USER: candy
      POSTGRES_PASSWORD: candy
      POSTGRES_DB: candyspet
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U candy -d candyspet"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: installs workspace dependencies from the lockfile into the
  # bind-mounted node_modules. App services wait for it to finish so they
  # never install concurrently against the shared directory.
  deps:
    <<: *app-image
    working_dir: /app
    # --store-dir keeps the package store out of the bind-mounted repo (pnpm
    # would otherwise create ./.pnpm-store inside it).
    command: ["sh", "-ec", "CI=true pnpm install --frozen-lockfile --store-dir /pnpm-store"]
    volumes:
      - .:/app
      - pnpm_store:/pnpm-store

  # One-shot: creates/updates the schema (stock, orders, settings, product_images).
  db-push:
    <<: *app-image
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy
      deps:
        condition: service_completed_successfully
    environment: *app-env
    command: ["sh", "-ec", "pnpm --filter @workspace/db run push-force"]
    volumes:
      - .:/app

  api:
    <<: *app-image
    working_dir: /app
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
      db-push:
        condition: service_completed_successfully
    # Platform-managed secrets (/run/base44/app.env) — never overridden here.
    env_file:
      - /run/base44/app.env
    environment:
      - PORT=8080
      - NODE_ENV=development
      - DATABASE_URL=postgres://candy:candy@db:5432/candyspet
      - BASE44_PREVIEW_MODE
    volumes:
      - .:/app
    # Project's own dev command: esbuild bundle + node (no watch server upstream).
    command: ["sh", "-ec", "exec pnpm --filter @workspace/api-server run dev"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  web:
    <<: *app-image
    working_dir: /app
    restart: on-failure
    depends_on:
      deps:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    ports:
      - "3000:25253"
    environment:
      - PORT=25253
      - BASE_PATH=/
      # Vite dev server proxies /api to the API container (single origin,
      # so admin session cookies keep working).
      - API_PROXY_TARGET=http://api:8080
      - BASE44_PREVIEW_MODE
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    volumes:
      - .:/app
    command: ["sh", "-ec", "exec pnpm --filter @workspace/candys-pet run dev"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:25253/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 40s

volumes:
  db_data:
  pnpm_store:
